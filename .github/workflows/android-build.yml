name: Coffee Roast Android Build
on:
  push:
    branches: ["main","master"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-release:
    name: Build signed release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract Coffee Roast source
        run: |
          ZIP_FILE=$(ls -t CoffeeRoast-*-source.zip 2>/dev/null | head -n1)
          test -n "$ZIP_FILE" || (echo "No CoffeeRoast-*-source.zip found in repo root" && ls -la && exit 1)
          echo "Using $ZIP_FILE"
          rm -rf extracted_project
          mkdir extracted_project
          unzip -q "$ZIP_FILE" -d extracted_project
          test -f extracted_project/settings.gradle.kts || (echo "Invalid source ZIP" && exit 1)
          cp -a extracted_project/. ./
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing KEYSTORE_BASE64" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest --stacktrace
      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease --stacktrace
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: CoffeeRoast-v0.4.3-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
