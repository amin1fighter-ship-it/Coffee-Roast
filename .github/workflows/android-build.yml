name: Build Android APK from Zip

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Project Zip
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE..."
            mkdir -p unzipped_src
            unzip -q "$ZIP_FILE" -d unzipped_src
            
            # پیدا کردن پوشه‌ای که تنظیمات پروژه داخلش هست
            PROJECT_DIR=$(find unzipped_src -name "build.gradle.kts" -type f | head -n 1 | xargs dirname)
            if [ -n "$PROJECT_DIR" ]; then
              echo "Project root found at: $PROJECT_DIR"
              shopt -s dotglob
              cp -r "$PROJECT_DIR"/* ./
            else
              echo "ERROR: build.gradle.kts not found!"
              exit 1
            fi
            
            rm -rf unzipped_src
            rm -f "$ZIP_FILE"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Gradle CLI
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
