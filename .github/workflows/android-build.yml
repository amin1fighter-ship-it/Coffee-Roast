name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Gradle project
        run: |
          set -e
          if [ -f settings.gradle.kts ]; then
            echo "Using root project"
          elif [ -f project/settings.gradle.kts ]; then
            echo "Using project/ subdirectory"
            cp -a project/. ./
          elif ls CoffeeRoast-*-source.zip 1>/dev/null 2>&1; then
            ZIP_FILE=$(ls -t CoffeeRoast-*-source.zip | head -n1)
            echo "Extracting $ZIP_FILE"
            mkdir -p extracted_project
            unzip -q "$ZIP_FILE" -d extracted_project
            if [ -f extracted_project/settings.gradle.kts ]; then
              cp -a extracted_project/. ./
            elif ls extracted_project/*/settings.gradle.kts 1>/dev/null 2>&1; then
              DIR=$(dirname $(ls extracted_project/*/settings.gradle.kts | head -n1))
              cp -a "$DIR"/. ./
            else
              echo "Invalid source ZIP layout"
              find extracted_project -maxdepth 3
              exit 1
            fi
            rm -rf extracted_project
          else
            echo "No Gradle project or source ZIP found"
            ls -la
            exit 1
          fi
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          echo "Gradle project ready."
          head -5 app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          test -n "$KEYSTORE_BASE64" || (echo "ERROR: Missing KEYSTORE_BASE64 secret" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"
          echo "Keystore decoded successfully."

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest --stacktrace

      - name: Build signed release
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          gradle --no-daemon assembleRelease --stacktrace

      - name: Verify APK
        run: |
          set -e
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoffeeRoast-v0.5.0-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
