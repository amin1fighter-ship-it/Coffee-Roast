name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Coffee Roast Project
        run: |
          set -e

          ZIP_FILE="CoffeeRoast-source.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found in repo root"
            echo "Repository contents:"
            ls -la
            exit 1
          fi

          echo "Found $ZIP_FILE"

          mkdir -p extracted_project
          unzip -q "$ZIP_FILE" -d extracted_project

          echo "Extracted project:"
          find extracted_project -maxdepth 3 -type f | sort

          if [ ! -f "extracted_project/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts not found after extraction"
            find extracted_project -maxdepth 4
            exit 1
          fi

          cp -a extracted_project/. ./
          rm -rf extracted_project

          echo "Checking Gradle project..."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

          echo "Gradle project detected successfully."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          test -n "$KEYSTORE_BASE64" || (
            echo "ERROR: Missing KEYSTORE_BASE64 secret"
            exit 1
          )

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

          test -s "$RUNNER_TEMP/release.keystore"

          echo "Keystore decoded successfully."

      - name: Build signed release
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          test -n "$KEYSTORE_PASSWORD" || (
            echo "ERROR: KEYSTORE_PASSWORD is missing"
            exit 1
          )

          test -n "$KEY_ALIAS" || (
            echo "ERROR: KEY_ALIAS is missing"
            exit 1
          )

          test -n "$KEY_PASSWORD" || (
            echo "ERROR: KEY_PASSWORD is missing"
            exit 1
          )

          gradle --no-daemon assembleRelease --stacktrace

      - name: Verify APK
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"

          echo "APK successfully built:"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoffeeRoast-v0.3.2-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
